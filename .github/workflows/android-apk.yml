name: BAB Android CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Verify Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/layout/activity_main.xml

      - name: Build debug APK (compile check)
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Run Android unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test reports (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

      - name: Post test failure details (diagnostic)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, json, os, urllib.request
          parts = []
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              try:
                  t = ET.parse(f).getroot()
                  for tc in t.iter('testcase'):
                      fail = tc.find('failure') or tc.find('error')
                      if fail is not None:
                          parts.append(f"FAIL {tc.get('classname')}.{tc.get('name')}\n{(fail.get('message') or '')[:500]}\n{(fail.text or '')[:1200]}")
              except Exception as e:
                  parts.append(f'parse error {f}: {e}')
          body = 'Android unit test failures (auto):\n\n' + ('\n---\n'.join(parts) if parts else 'No failure details parsed from XML. Check android-test-reports artifact/logs.')
          sha = os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/commits/{sha}/comments', data=json.dumps({'body': body[:60000]}).encode(), headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}', 'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          try:
              urllib.request.urlopen(req).read(); print('posted')
          except Exception as e:
              print('post failed', e); print(body)
          PY

      - name: Verify APK
        if: success()
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BAB-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  backend-checks:
    name: Backend Checks (optional legacy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall -q .
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
