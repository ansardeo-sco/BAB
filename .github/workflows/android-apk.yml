name: BAB Android CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Restore consistent signing key (GitHub Secrets)
        env:
          BAB_KEYSTORE_BASE64: ${{ secrets.BAB_KEYSTORE_BASE64 }}
          BAB_KEYSTORE_PASSWORD: ${{ secrets.BAB_KEYSTORE_PASSWORD }}
          BAB_KEY_ALIAS: ${{ secrets.BAB_KEY_ALIAS }}
          BAB_KEY_PASSWORD: ${{ secrets.BAB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Auto-increasing versionCode for every workflow run (update-compatible APKs).
          echo "VERSION_CODE_OVERRIDE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_NAME_OVERRIDE=1.0.0-bab.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          # Pass signing credentials only if provided via GitHub Secrets (never committed).
          if [ -n "${BAB_KEYSTORE_PASSWORD:-}" ]; then echo "BAB_KEYSTORE_PASSWORD=$BAB_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"; fi
          if [ -n "${BAB_KEY_ALIAS:-}" ]; then echo "BAB_KEY_ALIAS=$BAB_KEY_ALIAS" >> "$GITHUB_ENV"; fi
          if [ -n "${BAB_KEY_PASSWORD:-}" ]; then echo "BAB_KEY_PASSWORD=$BAB_KEY_PASSWORD" >> "$GITHUB_ENV"; fi

          if [ -n "${BAB_KEYSTORE_BASE64:-}" ]; then
            echo "$BAB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bab-release.keystore"
            echo "BAB_KEYSTORE_PATH=$RUNNER_TEMP/bab-release.keystore" >> "$GITHUB_ENV"
            echo "Signing keystore restored from secrets for update-compatible builds."
          else
            echo "::warning::BAB_KEYSTORE_BASE64 secret not set. CI will use the runner's default debug keystore (ephemeral), so successive CI APKs may NOT install as updates over installs signed with a different key. Configure BAB_KEYSTORE_BASE64, BAB_KEYSTORE_PASSWORD, BAB_KEY_ALIAS, BAB_KEY_PASSWORD with the ORIGINAL signing key (do not generate/replace silently)."
          fi
          echo "applicationId=com.ansardeo.bab versionCode=$GITHUB_RUN_NUMBER"

      - name: Verify Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/layout/activity_main.xml

      - name: Build debug APK (compile check)
        id: build
        run: |
          set +e
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/build.log
          ec=${PIPESTATUS[0]}
          echo "exit=$ec" >> $GITHUB_OUTPUT
          if [ $ec -ne 0 ]; then
            echo "---- COMPILE FAILURE (tail) ----"
            tail -n 220 /tmp/build.log || true
            echo "---- COMPILE FAILURE (errors) ----"
            grep -n "e: \|FAILURE\|Execution failed\|error:\|Unresolved\|Type mismatch\|None of the following\|Cannot access\|Symbol\|Expecting" /tmp/build.log | tail -n 80 || true
          fi
          exit $ec

      - name: Run Android unit tests
        id: tests
        run: |
          set +e
          gradle --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee /tmp/test.log
          ec=${PIPESTATUS[0]}
          if [ $ec -ne 0 ]; then
            echo "---- TEST FAILURE (tail) ----"; tail -n 220 /tmp/test.log || true
            grep -n "FAILED\|FAILURE\|There were failing tests\|> Task .* FAILED" /tmp/test.log | tail -n 60 || true
          fi
          exit $ec

      - name: Upload test reports (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

      - name: Post test/build failure details (diagnostic)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, json, os, urllib.request, re
          parts = []
          for lp in ['/tmp/build.log', '/tmp/test.log']:
              if os.path.exists(lp):
                  txt = open(lp, 'r', errors='ignore').read().splitlines()
                  keys = [i for i,l in enumerate(txt) if re.search(r'FAILURE:|Execution failed|^e: |error:|FAILED|Unresolved reference|Type mismatch|Could not resolve|Compilation error', l)]
                  if keys:
                      s=max(0,keys[0]-8); e=min(len(txt),keys[0]+140)
                      parts.append(f'== {lp} (key excerpt) ==\n' + '\n'.join(txt[s:e])[:12000])
                  else:
                      parts.append(f'== {lp} (tail) ==\n' + '\n'.join(txt[-120:])[:8000])
          xmls = glob.glob('app/build/**/TEST-*.xml', recursive=True) + glob.glob('app/build/test-results/**/*.xml', recursive=True)
          parts.append('XML files: ' + str(xmls[:20]))
          for pth in sorted(set(xmls)):
              try:
                  t = ET.parse(pth).getroot()
                  parts.append(f'== {pth} tests={t.get("tests")} failures={t.get("failures")} errors={t.get("errors")}')
                  for tc in t.iter('testcase'):
                      fail = tc.find('failure') or tc.find('error')
                      if fail is not None:
                          parts.append(f"FAIL {tc.get('classname')}.{tc.get('name')}: {(fail.get('message') or '')[:500]}\n{(fail.text or '')[:1800]}")
              except Exception as e:
                  parts.append(f'parse error {pth}: {e}')
          body = 'BAB build/test diagnostic (auto):\n\n' + '\n\n'.join(parts)
          sha = os.environ['GITHUB_SHA']; repo = os.environ['GITHUB_REPOSITORY']
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/commits/{sha}/comments', data=json.dumps({'body': body[:60000]}).encode(), headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}', 'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          try: urllib.request.urlopen(req).read(); print('posted')
          except Exception as e: print('post failed', e); print(body)
          PY

      - name: Verify APK (package, version, signing)
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/Binance-Bot.apk
          test -s "$APK"
          ls -lh "$APK"
          echo "---- package/version ----"
          AAPT2=""
          if [ -n "${ANDROID_HOME:-}" ]; then
            AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK" | grep -E "package:|application-label:|versionCode|versionName" || true
          else
            echo "aapt2 not found"
          fi
          echo "---- signing certificate ----"
          APKSIGNER=""
          if [ -n "${ANDROID_HOME:-}" ]; then
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" || true
          elif command -v keytool >/dev/null 2>&1; then
            keytool -printcert -jarfile "$APK" || true
          else
            echo "apksigner/keytool not found"
          fi
          echo "---- update-compat note ----"
          if [ -z "${BAB_KEYSTORE_PATH:-}" ]; then
            echo "WARNING: built without BAB signing secrets; certificate may differ from previously installed APKs."
          else
            echo "Built with configured BAB signing key and run-based versionCode."
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Binance-Bot-APK-debug
          path: app/build/outputs/apk/debug/Binance-Bot.apk
          if-no-files-found: error
          retention-days: 14

  backend-checks:
    name: Backend Checks (optional legacy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall -q .
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
