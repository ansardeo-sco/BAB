name: BAB-Next Android CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build debug APK (compile check)
        id: build
        run: |
          set +e
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/build.log
          ec=${PIPESTATUS[0]}
          echo "exit=$ec" >> $GITHUB_OUTPUT
          if [ $ec -ne 0 ]; then
            echo "---- COMPILE FAILURE (tail) ----"
            tail -n 220 /tmp/build.log || true
            echo "---- COMPILE FAILURE (errors) ----"
            grep -n "e: \|FAILURE\|Execution failed\|error:\|Unresolved\|Type mismatch" /tmp/build.log | tail -n 80 || true
          fi
          exit $ec

      - name: Run Android unit tests
        id: tests
        run: |
          set +e
          gradle --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee /tmp/test.log
          ec=${PIPESTATUS[0]}
          if [ $ec -ne 0 ]; then
            echo "---- TEST FAILURE (tail) ----"; tail -n 220 /tmp/test.log || true
          fi
          exit $ec

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android persistence and UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BAB-Next-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14