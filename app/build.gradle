plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

def babVersionCode = (project.findProperty("versionCodeOverride")
        ?: System.getenv("VERSION_CODE_OVERRIDE")
        ?: System.getenv("GITHUB_RUN_NUMBER")
        ?: "3").toString().toInteger()
def babVersionName = (project.findProperty("versionNameOverride")
        ?: System.getenv("VERSION_NAME_OVERRIDE")
        ?: "1.0.0-bab.${babVersionCode}").toString()

def babKeystorePath = (project.findProperty("BAB_KEYSTORE_PATH")
        ?: System.getenv("BAB_KEYSTORE_PATH")
        ?: "").toString()
def babKeystorePassword = (project.findProperty("BAB_KEYSTORE_PASSWORD")
        ?: System.getenv("BAB_KEYSTORE_PASSWORD")
        ?: "").toString()
def babKeyAlias = (project.findProperty("BAB_KEY_ALIAS")
        ?: System.getenv("BAB_KEY_ALIAS")
        ?: "").toString()
def babKeyPassword = (project.findProperty("BAB_KEY_PASSWORD")
        ?: System.getenv("BAB_KEY_PASSWORD")
        ?: "").toString()
def hasBabSigning = babKeystorePath && file(babKeystorePath).exists() && babKeystorePassword && babKeyAlias && babKeyPassword

android {
    namespace 'com.ansardeo.binancebot'
    compileSdk 34

    defaultConfig {
        applicationId "com.ansardeo.bab"
        minSdk 24
        targetSdk 34
        versionCode babVersionCode
        versionName babVersionName
        // No backend required for BAB Stage 1/2. Stage 3 live integration is scaffolded/disabled.
        buildConfigField "String", "BACKEND_BASE_URL", "\"\""
    }

    signingConfigs {
        if (hasBabSigning) {
            bab {
                storeFile file(babKeystorePath)
                storePassword babKeystorePassword
                keyAlias babKeyAlias
                keyPassword babKeyPassword
            }
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (hasBabSigning) {
                signingConfig signingConfigs.bab
            }
        }

        release {
            minifyEnabled false
            if (hasBabSigning) {
                signingConfig signingConfigs.bab
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Downloaded/installed artifact name required by the release checklist.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'debug') {
                outputFileName = 'Binance-Bot.apk'
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    testImplementation 'junit:junit:4.13.2'
}
